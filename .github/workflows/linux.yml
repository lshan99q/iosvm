name: linux-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1 — the gate. A bare runner, no Apple file, no QEMU fork, no GPU.
  # A contributor without an iPhone or a Mac must be able to stay green here.
  provenance:
    name: provenance + secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --history needs every commit

      - name: No Apple artifacts, no undeclared binaries
        run: python3 tools/provenance-check.py --root .

      - name: No credentials in the work tree or in history
        run: python3 tools/provenance-check.py --root . --history

      - name: No dangling references in the docs
        run: python3 tools/check-links.py

  test-open:
    name: test-open (no Apple file)
    runs-on: ubuntu-24.04
    needs: provenance
    steps:
      - uses: actions/checkout@v4

      # make test-open needs python3 and git, both on a stock runner. Nothing to install.
      - name: The contributor gate
        run: make test-open

      - name: Doctor (informational — a warning must not fail the job)
        run: tools/doctor.sh || true

  style:
    name: style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format shellcheck

      - name: SPDX headers (this tree and every fetched component)
        run: tools/check-spdx.sh

      - name: clang-format
        run: |
          files=$(git ls-files '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' '*.m' '*.mm' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          else
            echo "no C sources yet — nothing to format"
          fi

      - name: shellcheck
        run: shellcheck --severity=warning tools/*.sh

  # Tier 2 (vkbridge against lavapipe) lands with M2. It is not a job yet rather than a job that
  # cannot fail: `make test-gpu` exits 1 by design until hw/virtio-iosvm-gpu exists.
