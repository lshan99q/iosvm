name: linux-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1 — the gate. A bare runner, no Apple file, no QEMU fork, no GPU.
  # A contributor without an iPhone or a Mac must be able to stay green here.
  provenance:
    name: provenance + secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No Apple artifacts, no undeclared binaries
        run: python3 tools/provenance-check.py --root .

      - name: No credentials in the work tree or in history
        run: python3 tools/provenance-check.py --root . --history

  test-open:
    name: test-open (no Apple file)
    runs-on: ubuntu-24.04
    needs: provenance
    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config shellcheck \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - name: The contributor gate
        run: make test-open

      - name: Doctor (informational — a warning must not fail the job)
        run: tools/doctor.sh || true

  style:
    name: style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format shellcheck clang

      - name: SPDX headers
        run: python3 tools/check-spdx.py

      - name: clang-format
        run: |
          files=$(git ls-files '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' '*.m' '*.mm' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          else
            echo "no C sources yet — nothing to format"
          fi

      - name: shellcheck
        run: shellcheck --severity=warning tools/*.sh

  # Tier 2 — optional. Needs a Vulkan driver but still no Apple file. Not a merge gate yet.
  vkbridge-fake-gpu:
    name: vkbridge on lavapipe
    runs-on: ubuntu-24.04
    needs: provenance
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev libdrm-dev
      - name: fake-gpu
        run: make test-gpu
